name: Cross-platform flake evaluation
on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - bin/nix-xd-entry
      - .github/workflows/flake-contract.yml
  workflow_dispatch:
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve the pinned Nix-Alpine input
        run: |
          nix flake lock --update-input nix-alpine
          cat flake.lock
      - name: Evaluate Linux and Darwin app outputs
        run: |
          nix eval --json --expr 'let f = builtins.getFlake (toString ./.); in builtins.attrNames f.apps'
          nix eval --raw .#packages.x86_64-linux.operator.name
          nix eval --raw .#packages.aarch64-darwin.operator.name
