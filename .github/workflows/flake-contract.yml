name: Cross-platform flake evaluation
on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - tests/plan-fixture/flake.nix
      - tests/plan-fixture/flake.lock
      - bin/nix-xd-entry
      - .github/workflows/flake-contract.yml
  workflow_dispatch:
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve canonical Podman Nix-Alpine candidate
        run: nix flake prefetch --json github:dash-xd/nix-alpine/dc7a9e6a257adaa6d20666d1608b5d84c9961d33
      - name: Verify pinned Nix-Alpine input
        run: |
          nix flake metadata --json >/dev/null
          nix flake metadata --json ./tests/plan-fixture >/dev/null
          git diff --exit-code -- flake.lock tests/plan-fixture/flake.lock
      - name: Evaluate Linux and Darwin app outputs
        run: |
          nix eval --json --apply builtins.attrNames .#apps
          nix eval --raw .#packages.x86_64-linux.operator.name
          nix eval --raw .#packages.aarch64-darwin.operator.name
