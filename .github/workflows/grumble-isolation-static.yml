name: Independent store static qualification
on:
  push:
    branches: [codex/grumble-isolated-writer]
    paths:
      - .github/workflows/grumble-isolation-static.yml
      - bin/nix-xd-store-isolation
      - tests/store-isolation-contract.sh
      - Makefile
  pull_request:
    paths:
      - .github/workflows/grumble-isolation-static.yml
      - bin/nix-xd-store-isolation
      - tests/store-isolation-contract.sh
      - Makefile
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate isolated-writer fail-closed semantics without runtime mutation
        shell: bash
        run: |
          set -euo pipefail
          bash tests/store-isolation-contract.sh
