name: ARM runner static qualification
on:
  push:
    paths:
      - Makefile
      - flake.nix
      - guest/nix-alpine/**
      - lib/workloads.py
      - tests/workloads.py
      - tests/guest-executor.py
      - tests/workload-transport.py
      - bin/nix-xd-workload
      - bin/nix-xd-workload-start
      - tests/coreos-managed-start.py
      - bin/nix-xd-workload-qualify
      - bin/nix-xd-guest-store-exec
      - bin/nix-xd-store-root-guest
      - bin/nix-xd-qualify-starwisp
      - arm/bootstrap-macos.sh
      - arm/bootstrap-podman.sh
      - arm/bootstrap-container.sh
      - bin/nix-xd-container
      - bin/nix-xd-task
      - bin/nix-xd-coreos-hvf
      - bin/nix-xd-coreos-podman
      - bin/nix-xd-wisp-ssh
      - bin/nix-xd-sync
      - tests/make-contract.sh
      - tests/stage-workspace-contract.sh
      - tests/coreos-host-contract.sh
      - .github/workflows/arm-make-check.yml
  pull_request:
    paths:
      - Makefile
      - flake.nix
      - guest/nix-alpine/**
      - lib/workloads.py
      - tests/workloads.py
      - tests/guest-executor.py
      - tests/workload-transport.py
      - bin/nix-xd-workload
      - bin/nix-xd-workload-start
      - tests/coreos-managed-start.py
      - bin/nix-xd-workload-qualify
      - bin/nix-xd-guest-store-exec
      - bin/nix-xd-store-root-guest
      - bin/nix-xd-qualify-starwisp
      - arm/bootstrap-macos.sh
      - arm/bootstrap-podman.sh
      - arm/bootstrap-container.sh
      - bin/nix-xd-container
      - bin/nix-xd-task
      - bin/nix-xd-coreos-hvf
      - bin/nix-xd-coreos-podman
      - bin/nix-xd-wisp-ssh
      - bin/nix-xd-sync
      - tests/make-contract.sh
      - tests/stage-workspace-contract.sh
      - .github/workflows/arm-make-check.yml
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap and Make targets
        run: make check-static
      - name: Test workload transport with Bash 3.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 60 https://ftp.gnu.org/gnu/bash/bash-3.2.tar.gz -o "$RUNNER_TEMP/bash32.tar.gz"
          printf '%s  %s\n' 26c99025b59e30779300b68adb764f824974d267a4d7cc1b347d14a2393f9fb4 "$RUNNER_TEMP/bash32.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/bash32.tar.gz" -C "$RUNNER_TEMP"
          (
            cd "$RUNNER_TEMP/bash-3.2"
            ./configure --without-bash-malloc --disable-nls CFLAGS=-std=gnu89 > configure.log 2>&1 || { tail -50 configure.log; exit 1; }
            make -j2 > build.log 2>&1 || { tail -50 build.log; exit 1; }
          )
          NIX_XD_TEST_BASH="$RUNNER_TEMP/bash-3.2/bash" python3 tests/workload-transport.py
      - name: Test generic Nix command contract
        run: bash tests/make-contract.sh
      - name: Check workspace staging contract
        run: bash tests/stage-workspace-contract.sh
      - name: Check host CoreOS adapter contract
        run: bash tests/coreos-host-contract.sh
      - name: Verify both provider command interfaces
        run: |
          make help
          make plan
          make plan PROVIDER=container OS=Darwin
          make -n bootstrap PROVIDER=container OS=Darwin
          make -n bootstrap PROVIDER=podman OS=Darwin
          make -n PROVIDER=container OS=Darwin build FLAKE=compositions/agni TARGET='#test'
          make -n PROVIDER=podman qualify-process FLAKE=compositions/agni
          make -n PROVIDER=container OS=Darwin stage CHECKOUT=compositions/agni

