name: ARM runner static qualification
on:
  push:
    paths:
      - Makefile
      - arm/bootstrap-macos.sh
      - arm/bootstrap-podman.sh
      - arm/bootstrap-container.sh
      - bin/nix-xd-inventory
      - bin/nix-xd-container
      - bin/nix-xd-task
      - bin/nix-xd-sync
      - bin/nix-xd-plan
      - bin/nix-xd-smoke
      - bin/nix-xd-workspace-check
      - bin/nix-xd-store-copy
      - bin/nix-xd-share-check
      - bin/nix-xd-entry
      - tests/plan-contract.sh
      - tests/stage-contract.sh
      - tests/apple-mount-contract.sh
      - tests/store-copy-contract.sh
      - tests/workspace-mount-contract.sh
      - tests/plan-fixture/**
      - tests/plan-fixture-test.sh
      - tests/plan-make-exit-contract.sh
      - tests/make-contract.sh
      - .github/workflows/arm-make-check.yml
  pull_request:
    paths:
      - Makefile
      - arm/bootstrap-macos.sh
      - arm/bootstrap-podman.sh
      - arm/bootstrap-container.sh
      - bin/nix-xd-inventory
      - bin/nix-xd-container
      - bin/nix-xd-task
      - bin/nix-xd-sync
      - bin/nix-xd-plan
      - bin/nix-xd-smoke
      - bin/nix-xd-workspace-check
      - bin/nix-xd-store-copy
      - bin/nix-xd-share-check
      - bin/nix-xd-entry
      - tests/plan-contract.sh
      - tests/stage-contract.sh
      - tests/apple-mount-contract.sh
      - tests/store-copy-contract.sh
      - tests/workspace-mount-contract.sh
      - tests/plan-fixture/**
      - tests/plan-fixture-test.sh
      - tests/plan-make-exit-contract.sh
      - tests/make-contract.sh
      - .github/workflows/arm-make-check.yml
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap and Make targets
        run: make check-static
      - name: Test generic Nix command contract
        run: bash tests/make-contract.sh
      - name: Test generic plan transport and capability fences
        run: bash tests/plan-contract.sh
      - name: Test staging success and failure cleanup
        run: bash tests/stage-contract.sh
      - name: Verify schema-v2 module lifecycle fixture
        run: bash tests/plan-fixture-test.sh
      - name: Verify Make plan error propagation through logger
        run: bash tests/plan-make-exit-contract.sh
      - name: Verify Apple workspace bind mount bootstrap
        run: bash tests/apple-mount-contract.sh
      - name: Verify Nix store closure transfer contract
        run: bash tests/store-copy-contract.sh
      - name: Verify host/guest workspace identity
        run: bash tests/workspace-mount-contract.sh
      - name: Verify both provider command interfaces
        run: |
          make help
          make plan
          make plan PROVIDER=container OS=Darwin
          make -n bootstrap PROVIDER=container OS=Darwin
          make -n bootstrap PROVIDER=podman OS=Darwin
          make -n PROVIDER=container OS=Darwin build FLAKE=compositions/agni TARGET='#test'
          make -n PROVIDER=podman qualify-process FLAKE=compositions/agni
          make -n PROVIDER=podman OS=Darwin refresh
          make -n PROVIDER=podman OS=Darwin inventory
          make -n PROVIDER=container OS=Darwin smoke
          make -n PROVIDER=container OS=Darwin workspace-check
          make -n PROVIDER=container OS=Darwin share-check READER_SCOPE=nix-xd-smoke-reader
          make -n PROVIDER=container OS=Darwin stage CHECKOUT=compositions/agni
          make -n PROVIDER=container OS=Darwin qualify-plan PLAN_REPO=example/test PLAN_REV=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa PLAN_CHECKOUT=compositions/test PLAN_FILE=plan.json PLAN_FLAKE=qualify PLAN_CAPABILITIES=nix-exec
