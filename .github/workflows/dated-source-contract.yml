name: Dated Nix-Alpine source contracts
on:
  push:
    branches:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generic GHXD source contract
        run: python3 tests/ghxd-source-version.py
      - name: Check generic Nix application dispatch
        run: |
          make -n qualify QUALIFY_APP=1 FLAKE=example20261112/local/example TARGET='#qualify' ARGS='--phase verify' >/dev/null
          if make ghxd-source-version-check; then echo 'Missing manifest accepted' >&2; exit 1; fi
