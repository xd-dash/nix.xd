name: Independent Nix writer static qualification
on:
  push:
    branches:
      - codex/nix-store-consolidated
    paths:
      - .github/workflows/nix-store-isolation-static.yml
      - bin/nix-xd-store-isolation
      - bin/nix-xd-builder-profile-prestart
      - bin/nix-xd-builder-seccomp.py
      - bin/nix-xd-builder-store-qualify-atomic
      - lib/builder-stores.sh
      - arm/bootstrap-podman.sh
      - mk/bootstrap-arm64.mk
      - mk/builder-store-profile.mk
      - tests/builder-atomic.py
      - tests/store-isolation-contract.sh
      - Makefile
  pull_request:
    paths:
      - .github/workflows/nix-store-isolation-static.yml
      - bin/nix-xd-store-isolation
      - bin/nix-xd-builder-profile-prestart
      - bin/nix-xd-builder-seccomp.py
      - bin/nix-xd-builder-store-qualify-atomic
      - lib/builder-stores.sh
      - arm/bootstrap-podman.sh
      - mk/bootstrap-arm64.mk
      - mk/builder-store-profile.mk
      - tests/builder-atomic.py
      - tests/store-isolation-contract.sh
      - Makefile
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check consolidated Nix store contracts
        shell: bash
        run: |
          set -euo pipefail
          make nix-store-check
